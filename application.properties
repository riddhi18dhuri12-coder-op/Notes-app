# Spring Boot Application Configuration

# Server Configuration
server.port=8080
server.servlet.context-path=/

# Application Name
spring.application.name=Notes Application

# Logging
logging.level.root=INFO
logging.level.com.notes=DEBUG

# CORS Configuration
# Allow requests from all origins (for development)
# In production, specify the actual frontend URL

# Disable default error page for better API responses
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=on_param
server.error.include-exception=false

# Threading
spring.threads.virtual.enabled=true

# Jackson JSON Configuration
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false

# Additional Notes
# To enable database persistence, add the following dependencies to pom.xml:
# - spring-boot-starter-data-jpa
# - h2database (for embedded) or mysql-connector-java (for MySQL)
# 
# Then configure database properties:
# spring.datasource.url=jdbc:h2:mem:testdb
# spring.datasource.driverClassName=org.h2.Driver
# spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
